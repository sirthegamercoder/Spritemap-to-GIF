name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} release archive
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script_path: "setup.sh"
            shell_type: bash
          - os: windows-latest
            script_path: "setup.bat"
            shell_type: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install requirements
        shell: ${{ matrix.shell_type }}
        run: |
          ${{ matrix.script_path }}

      - name: Build release archive
        run: python build.py

      - name: Upload build archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: dist/*.zip