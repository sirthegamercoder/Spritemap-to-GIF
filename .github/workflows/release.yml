name: Release Build

on:
  branches: ["main"]
    
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} release archive
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script_path: "setup.sh"
          - os: windows-latest
            script_path: "setup.bat"

    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install requirements (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./${{ matrix.script_path }}

      - name: Install requirements (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ${{ matrix.script_path }}

      - name: Build release archive
        run: python build.py

      - name: Upload build archive
        uses: actions/upload-artifact@v7
        with:
          name: spritemap-to-gif-${{ runner.os }}
          path: dist/*.zip